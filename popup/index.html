<!DOCTYPE html>
<html>
<head>
	<link rel="stylesheet" href="style.css">
	<script src="ux.js"></script>
	<script type="module" src="script.js" defer></script>
</head>
<body class="view">
	<header style="display:flex;gap:.25em;">
		<button id="sponsor">Sponsor</button>
		<!-- Small square update button when available? -->
		<!-- <button class="tab" id="state"></button> -->
	</header>
	<nav>
		<button id="dashboard">Dashboard</button>
		<!-- <button id="accounts" disabled>Switch Accounts</button> -->
	</nav>
	<div class="details">
		<input type="radio" name="nav" id="options" checked>
		<label class="ripple" title="Displays featured ghosts on the leaderboard">
			<input type="checkbox" id="accountManager">
			<span>Account manager</span>
		</label>
		<label class="ripple" title="Displays featured ghosts on the leaderboard">
			<input type="checkbox" id="achievementMonitor">
			<span>Achievement monitor</span>
		</label>
		<label class="ripple" title="Displays featured ghosts on the leaderboard">
			<input type="checkbox" id="bestRaceDate">
			<span>Best race date</span>
		</label>
		<label class="ripple" title="Displays featured ghosts on the leaderboard">
			<input type="checkbox" id="featuredGhostsDisplay">
			<span>Featured ghosts</span>
		</label>
		<label class="ripple" title="Display last activity on all friends lists">
			<input type="checkbox" id="lastSeen">
			<span>Last activity</span>
		</label>
		<label class="ripple" title="Display last activity on user profiles" style="margin-left: 1.5em">
			<input type="checkbox" id="lastSeenProfile">
			<span>Display on profile</span>
		</label>
		<label class="ripple" title="Search and filter tracks on profiles">
			<input type="checkbox" id="profileSearch" checked disabled>
			<span>Profile search</span>
		</label>
		<details>
			<summary class="tab ripple">Show advanced options</summary>
			<label class="ripple" title="Enable custom context menu with added options">
				<input type="checkbox" id="contextMenu" checked>
				<span>Context menu</span>
			</label>
			<label class="ripple" title="Toggle developer mode">
				<input type="checkbox" id="developerMode">
				<span>Developer mode</span>
			</label>
			<details data-type="experiments" style="display: none;">
				<summary class="tab ripple">Experiments</summary>
				<label class="ripple" title="Toggle track playlists">
					<input type="checkbox" id="playlists">
					<span>Playlists</span>
				</label>
				<label title="Adjust how extreme a race time must be compared to others before being flagged">
					<span class="name">Flag sensitivity</span>
					<input type="range" class="override-pointer-events" id="flagSensitivity" min="0.1" value="1" max="2" step="0.1" style="width:100%">
				</label>
			</details>
			<button class="tab ripple" id="reset-settings" title="Reset all the settings to their default state (THIS CANNOT BE UNDONE)">Reset settings</button>
		</details>
	</div>
	<footer>Version: <span id="version"></span></footer>
</body>
</html>
